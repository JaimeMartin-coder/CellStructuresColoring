<!DOCTYPE html>
<html lang="en" data-font="standard" data-bg="white">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cell Adventures: Choose Your Cell Quest</title>
<style>
:root{
  --fs:18px; --lh:1.6; --ls:0em; --ws:0em;
  --bg:#F4F8FB; --card:#FFFFFF; --ink:#14213D; --muted:#44546E; --line:#C5D3E0;
  --teal:#0E9F9A; --tealdark:#0A726F; --sun:#FFC233; --pink:#E84A7F; --blue:#2F6FED;
  --good:#17703F; --goodbg:#E1F4E8; --bad:#A63A08; --badbg:#FCE9DC;
  --hl:#FFE27A; --glow:#F59E0B;
  --head:"Trebuchet MS","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --body:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
html[data-theme="quest"]{--bg:#F3EAD7;--card:#FFFBF0;--ink:#2B1B17;--muted:#5C463D;--line:#D8C9A8;--teal:#7A1F3D;--tealdark:#7A1F3D;--sun:#D9A441;--blue:#2F5DA8;--glow:#C2410C;
  --head:"Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif}
html[data-bg="cream"]{--bg:#FBF4E2;--card:#FFFDF6;--line:#DDD2B5}
html[data-bg="blue"]{--bg:#E3EFFA;--card:#F7FBFF;--line:#B7CCE0}
html[data-bg="gray"]{--bg:#E9EAEC;--card:#F8F8F9;--line:#C3C6CC}
html[data-font="easy"]{--body:Verdana,"DejaVu Sans",Tahoma,Arial,sans-serif;--head:Verdana,"DejaVu Sans",Tahoma,Arial,sans-serif;--ls:.03em;--ws:.12em}
*{box-sizing:border-box}
html{font-size:var(--fs)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);line-height:var(--lh);letter-spacing:var(--ls);word-spacing:var(--ws);text-align:left}
h1,h2,h3{font-family:var(--head);line-height:1.2;margin:0 0 .5rem}
p{margin:.5rem 0}
.app{max-width:1180px;margin:0 auto;padding:0 16px 48px}
button{font:inherit;letter-spacing:inherit;word-spacing:inherit;color:inherit}
:focus-visible{outline:4px solid var(--blue);outline-offset:3px}
main:focus,main:focus-visible{outline:none}

/* header */
.top{display:flex;align-items:center;gap:10px;padding:12px 0 10px;border-bottom:4px solid var(--ink);flex-wrap:wrap}
.top .brand{font-family:var(--head);font-weight:800;font-size:1.25rem;margin-right:auto;display:flex;align-items:center;gap:8px}
.brand svg{width:48px;height:auto}
.chip{border:2px solid var(--ink);border-radius:999px;padding:4px 14px;background:var(--card);font-weight:700;font-size:.85rem;white-space:nowrap}
.btn{font-weight:700;padding:11px 20px;min-height:46px;border-radius:12px;border:2px solid var(--ink);background:var(--card);cursor:pointer}
.btn:hover:not(:disabled){background:var(--sun)}
.btn.primary{background:var(--ink);color:#fff}
.btn.primary:hover:not(:disabled){background:#243a66}
.btn.small{padding:6px 14px;min-height:38px;font-size:.85rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}
.spacer{flex:1}

/* welcome */
.hero{padding:34px 0 10px}
.hero h1{font-size:clamp(2.6rem,7vw,4.4rem);font-weight:900;margin:0}
.hero .tag{font-size:1.15rem;max-width:36rem;margin:.5rem 0 1rem}
.line{display:flex;align-items:center;margin:18px 0 22px;max-width:640px}
.line b{width:22px;height:22px;border-radius:50%;border:4px solid var(--ink);background:var(--card);flex:none}
.line b:first-child{background:var(--teal)} .line b:last-child{background:var(--sun)}
.line span{height:6px;background:var(--ink);flex:1}
.setup{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;align-items:start}
.card{background:var(--card);border:2px solid var(--ink);border-radius:16px;padding:20px 24px}
.card h2{font-size:1.25rem}
.card ul{margin:.3rem 0 .3rem 1.2rem;padding:0}
.card li{margin:.25rem 0}
label.fld{display:block;font-weight:700;margin:10px 0 2px}
input[type=text]{font:inherit;padding:10px 12px;border:2px solid var(--ink);border-radius:10px;width:100%;background:#fff;color:var(--ink)}
.note{color:var(--muted);font-size:.85rem}

/* route map */
.route{list-style:none;margin:18px 0 0;padding:0}
.stop{display:grid;grid-template-columns:48px 1fr;gap:0 14px;position:relative;padding-bottom:18px}
.stop:before{content:"";position:absolute;left:20px;top:30px;bottom:-4px;width:6px;background:var(--line)}
.stop:last-child:before{display:none}
.stop.done:before{background:var(--teal)}
.dot{width:46px;height:46px;border-radius:50%;border:4px solid var(--ink);display:grid;place-items:center;font-family:var(--head);font-weight:800;background:var(--card);z-index:1}
.stop.done .dot{background:var(--teal);color:#fff}
.stop.next .dot{background:var(--sun)}
.stop.locked .dot{background:var(--line);color:var(--muted);border-color:var(--muted)}
.stop .card{padding:14px 20px}
.stop.locked .card{border-color:var(--muted);color:var(--muted)}
.stop h3{font-size:1.1rem;margin-bottom:.15rem}
.meta{font-size:.82rem;color:var(--muted)}
.stars{font-size:1.1rem;letter-spacing:.1em}

/* tour layout */
.tour{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(300px,1fr);gap:22px;align-items:start;margin-top:16px}
@media (max-width:880px){.tour{grid-template-columns:1fr}}
.diagram{background:#fff;border:2px solid var(--ink);border-radius:16px;padding:10px 10px 6px}
.diagram .cap{font-weight:700;font-size:.9rem;margin:0 0 4px 6px}
.diagram svg{width:100%;height:auto;display:block}
.progress{height:10px;border-radius:999px;background:var(--line);overflow:hidden;margin:14px 0 4px}
.progress div{height:100%;background:var(--teal)}
.stepno{font-weight:700;color:var(--tealdark);margin:0}
.found{display:inline-block;border:2px solid var(--ink);border-radius:999px;padding:1px 12px;font-size:.82rem;font-weight:700;background:var(--sun);margin:.2rem 0}
.city{background:var(--bg);border-left:6px solid var(--teal);padding:8px 12px;border-radius:0 10px 10px 0}
details.words{margin:10px 0}
details.words summary{cursor:pointer;font-weight:700}
details.words dl{margin:.4rem 0 0}
details.words dt{font-weight:700;margin-top:.3rem}
details.words dd{margin:0 0 0 1rem}
fieldset.todo{border:2px dashed var(--ink);border-radius:12px;margin:14px 0 4px;padding:8px 14px 10px}
fieldset.todo legend{font-weight:800;padding:0 6px}
fieldset.todo label{display:flex;gap:10px;align-items:flex-start;margin:8px 0;cursor:pointer}
fieldset.todo input{width:24px;height:24px;flex:none;margin-top:2px;accent-color:var(--teal)}
.swatch{display:inline-block;width:16px;height:16px;border-radius:4px;border:2px solid var(--ink);vertical-align:-2px;margin:0 4px}

/* quiz */
.quiz{max-width:800px;margin:18px auto 0}
.quiz.wide{max-width:none}
.qprompt{font-size:1.25rem;font-weight:700;margin:.4rem 0 .6rem;font-family:var(--head)}
.scene{background:var(--bg);border:2px solid var(--ink);border-radius:12px;padding:10px 16px;margin:8px 0 12px}
.choice{display:flex;gap:12px;align-items:center;width:100%;text-align:left;margin:8px 0;padding:12px 16px;border:2px solid var(--ink);border-radius:12px;background:var(--card);cursor:pointer;min-height:54px}
.choice:hover:not(:disabled):not(.correct):not(.wrong){background:#FFF3CC}
.choice .letter{width:34px;height:34px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-weight:800;flex:none;background:#fff}
.choice .txt{flex:1}
.choice .tag{font-weight:800;font-size:.85rem}
.choice.correct{background:var(--goodbg);border-color:var(--good);border-width:3px}
.choice.wrong{background:var(--badbg);border-color:var(--bad);border-style:dashed}
.choice:disabled{cursor:default}
.fb{border-radius:12px;padding:10px 16px;margin:12px 0;border:2px solid var(--ink);background:var(--card)}
.fb.good{background:var(--goodbg);border-color:var(--good)}
.fb.bad{background:var(--badbg);border-color:var(--bad)}
.sort3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:640px){.sort3{grid-template-columns:1fr}}
.sort3 .choice{justify-content:center;text-align:center;font-weight:700;margin:4px 0}
.bigword{font-size:1.6rem;font-family:var(--head);font-weight:800;text-align:center;padding:18px 8px;border:3px solid var(--ink);border-radius:16px;background:var(--card);margin:10px 0 14px}
.mini{max-width:460px;margin:10px auto 0}

/* diagram highlighting */
.cellsvg .org{transition:opacity .2s}
.cellsvg.focus .org:not(.hl){opacity:.32}
.cellsvg.focus .badge:not(.hl){opacity:.5}
.cellsvg .org.hl [fill="#fff"]{fill:var(--hl)}
.cellsvg .org.hl{filter:drop-shadow(0 0 5px var(--glow));animation:glow 1.6s ease-in-out infinite}
.cellsvg .org.hl[data-org="membrane"] [fill="#fff"]{fill:#fff}
.cellsvg .org.hl[data-org="membrane"] *{stroke:#D9480F;stroke-width:7px}
.cellsvg .org.hl[data-org="cytoplasm"] [fill-opacity]{fill:var(--hl);fill-opacity:.6}
.cellsvg.nobadge .badge{display:none}
.cellsvg .badge.hl text{fill:#000}
.cellsvg .badge.hl circle:nth-of-type(2){fill:var(--hl);stroke-width:4px}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 2px var(--glow))}50%{filter:drop-shadow(0 0 9px var(--glow))}}
@media (prefers-reduced-motion:reduce){.cellsvg .org.hl{animation:none}}


/* story */
.bubble{display:flex;gap:12px;align-items:flex-start;background:#FFF8DC;border:2px solid var(--ink);border-radius:18px 18px 18px 4px;padding:10px 14px;margin:12px 0}
.bubble .av{width:44px;height:44px;border-radius:50%;border:3px solid var(--ink);display:grid;place-items:center;font-family:var(--head);font-weight:900;flex:none}
.bubble p{margin:2px 0;flex:1}
.trail{position:relative;height:44px;margin:12px 0 10px;border-bottom:8px solid var(--line)}
.trail .fill{position:absolute;left:0;bottom:-8px;height:8px;background:var(--teal)}
.trail .bus{position:absolute;bottom:-3px;width:64px;transform-origin:bottom center;transition:left .5s ease,transform .5s ease}
.trail .bus svg{width:100%;height:auto;display:block}
.herobus{width:170px;transition:transform 1.1s ease-in,opacity 1.1s;transform-origin:left bottom;margin-bottom:6px}
.herobus svg{width:100%;height:auto;display:block}
.herobus.shrunk{transform:scale(.06);opacity:.2}
@media (prefers-reduced-motion:reduce){.herobus,.trail .bus{transition:none}}


/* picker + quest extras */
.picks{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:22px;margin-top:20px}
.pick{display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.pick .pickart{height:96px;display:flex;align-items:center;margin-bottom:6px}
.pick .pickart svg{height:90px;width:auto;display:block}
.pick .kind{font-weight:700;color:var(--muted);margin:0 0 6px}
.pick button{margin-top:auto}
.bossbar{margin:12px 0 10px;font-weight:700}
.bossbar .hp{height:22px;border:3px solid var(--ink);border-radius:999px;background:var(--card);overflow:hidden;margin-top:4px}
.bossbar .hp div{height:100%;background:#B3261E;transition:width .5s ease}
.herobus.spin{animation:dspin 1.3s ease-in-out;transform-origin:50% 50%}
html[data-theme="quest"] .herobus{width:120px}
@keyframes dspin{0%{transform:rotate(0)}100%{transform:rotate(900deg)}}
@media (prefers-reduced-motion:reduce){.herobus.spin{animation:none}.bossbar .hp div{transition:none}}
html[data-theme="quest"] .trail .bus{width:44px}

.spray{position:fixed;pointer-events:none;z-index:70;line-height:1}
.codecard{margin-top:16px;border-width:3px;border-style:dashed}
.codeword{font-family:var(--head);font-size:2.4rem;font-weight:900;letter-spacing:.12em;margin:.1rem 0 .4rem}
/* dialog */
.scrim{position:fixed;inset:0;background:rgba(20,33,61,.55);display:grid;place-items:center;padding:16px;z-index:50}
.panel{background:var(--card);border:3px solid var(--ink);border-radius:18px;max-width:520px;width:100%;padding:20px 24px;max-height:92vh;overflow:auto}
.panel h2{margin-bottom:.2rem}
.opt{margin:14px 0}
.opt b{display:block;margin-bottom:4px}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{padding:8px 14px;border:2px solid var(--ink);border-radius:10px;background:var(--card);cursor:pointer;font-weight:700;min-height:42px}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:12px;z-index:60}

/* summary */
.sumgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:12px}
.rank{font-family:var(--head);font-size:2rem;font-weight:900;margin:.2rem 0}
table.stats{border-collapse:collapse;width:100%}
table.stats th,table.stats td{border-bottom:2px solid var(--line);padding:8px 6px;text-align:left}
.checks li{margin:.4rem 0}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
"use strict";
const ORG = {"membrane": {"num": 1, "name": "Cell membrane", "job": "controls what goes in and out", "explain": "A thin, flexible layer around the cell. It lets helpful things in (like food and water) and keeps harmful things out.", "city": "The city gate. A guard checks everything that comes in or goes out.", "words": [["flexible", "can bend without breaking"]], "color": "orange", "found": "both"}, "cytoplasm": {"num": 2, "name": "Cytoplasm", "job": "jelly-like fluid that holds the organelles", "explain": "A thick, jelly-like liquid that fills the cell. All the organelles float in it, and many chemical reactions happen here.", "city": "The ground and air of the city. Every building sits in it.", "words": [["organelle", "a tiny part inside a cell that has a job"]], "color": "light yellow", "found": "both"}, "nucleus": {"num": 3, "name": "Nucleus", "job": "holds DNA and controls the cell", "explain": "The control center. It stores the cell's DNA, the instructions for everything the cell does.", "city": "City Hall. The plans and the rules are kept here.", "words": [["DNA", "the instruction code for building and running a cell"]], "color": "purple", "found": "both"}, "nucleolus": {"num": 4, "name": "Nucleolus", "job": "builds ribosomes", "explain": "A dark spot inside the nucleus. It builds ribosomes, the tiny machines that make proteins.", "city": "The tool factory inside City Hall. It makes the tools the workers need.", "words": [["ribosome", "a tiny machine that builds proteins"]], "color": "dark blue", "found": "both"}, "rer": {"num": 5, "name": "Rough ER", "job": "makes and moves proteins", "explain": "Folded sheets covered in ribosomes, so they look bumpy. Proteins are built here and sent on their way.", "city": "The assembly line. Workers (ribosomes) build products and send them down the line.", "words": [["protein", "a molecule that does most of the work in a cell"], ["ER", "short for endoplasmic reticulum"]], "color": "teal", "found": "both"}, "ser": {"num": 6, "name": "Smooth ER", "job": "makes lipids (fats) and cleans up toxins", "explain": "Folded tubes with no ribosomes, so they look smooth. They make lipids (fats) and break down harmful chemicals.", "city": "The chemical plant and cleanup crew.", "words": [["lipid", "a fat or oil molecule"], ["toxin", "a harmful substance"]], "color": "light green", "found": "both"}, "ribo": {"num": 7, "name": "Ribosomes", "job": "build proteins", "explain": "Tiny machines that build proteins. Some float in the cytoplasm and some sit on the rough ER.", "city": "The builders. Thousands of tiny workers, each one making a product.", "words": [["build", "put together piece by piece"]], "color": "pink", "found": "both"}, "golgi": {"num": 8, "name": "Golgi apparatus", "job": "sorts, packages, and ships proteins", "explain": "A stack of flat sacs. It receives proteins, packages them in bubbles, and ships them to where they are needed.", "city": "The post office. It sorts, wraps, and mails packages.", "words": [["package", "wrap something up so it can be sent"]], "color": "red", "found": "both"}, "mito": {"num": 9, "name": "Mitochondria", "job": "releases energy (ATP) from food", "explain": "The power plants. They break down food to make ATP, the energy the cell uses. Plant cells AND animal cells have them.", "city": "The power plant. It turns fuel into electricity for the whole city.", "words": [["ATP", "the energy molecule cells use"], ["mitochondria", "more than one mitochondrion"]], "color": "brown", "found": "both"}, "vacuole": {"num": 10, "name": "Vacuole", "job": "stores water, food, and waste", "explain": "A storage sac. Plant cells have one very large central vacuole full of water that keeps the cell firm. Animal cells have small ones.", "city": "The water tower and storage warehouse.", "words": [["store", "keep something for later"], ["firm", "stiff, not floppy"]], "color": "blue", "found": "both"}, "wall": {"num": 11, "name": "Cell wall", "job": "gives support and protection", "explain": "A stiff outer layer around a plant cell, outside the cell membrane. It holds the cell in shape and protects it.", "city": "The city wall. Strong and stiff.", "words": [["support", "hold up and keep in shape"]], "color": "tan", "found": "plant"}, "chloro": {"num": 12, "name": "Chloroplast", "job": "captures sunlight to make sugar", "explain": "Green parts that capture sunlight and use it to make sugar. This is photosynthesis. Only plant cells (and some other organisms) have them.", "city": "The solar farm. It turns sunlight into food.", "words": [["photosynthesis", "using sunlight to make sugar"]], "color": "green", "found": "plant"}, "lyso": {"num": 11, "name": "Lysosome", "job": "breaks down waste and old parts", "explain": "A small bubble full of enzymes. It breaks down waste, old cell parts, and germs the cell swallows.", "city": "The recycling center and cleanup crew.", "words": [["enzyme", "a protein that speeds up a chemical reaction"]], "color": "dark red", "found": "animal"}, "centri": {"num": 12, "name": "Centrioles", "job": "help the cell divide", "explain": "A pair of small tubes shaped like cylinders. They help organize the fibers that pull the cell's DNA apart when the cell divides.", "city": "The moving crew that helps a building split into two.", "words": [["divide", "split into two"]], "color": "gray", "found": "animal"}};
const PLANT_ORDER = ["membrane", "cytoplasm", "nucleus", "nucleolus", "rer", "ser", "ribo", "golgi", "mito", "vacuole", "wall", "chloro"];

const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const LET = ["A","B","C","D"];
function choicesFor(correct, pool, n=4){
  const out=[correct];
  const near = shuffle((CONF[correct]||[]).filter(k=>pool.includes(k)&&k!==correct));
  for (const k of near){ if (out.length<n-1) out.push(k); }
  for (const k of shuffle(pool)){ if (out.length<n && !out.includes(k)) out.push(k); }
  return shuffle(out);
}
function orderFor(key, make){ if (!S.ord[key]) S.ord[key] = make(); return S.ord[key]; }
function stopSpeech(){ try{ window.speechSynthesis && speechSynthesis.cancel(); }catch(e){} }
function speak(text){
  if (!("speechSynthesis" in window)) { toast("Read-aloud is not available on this device."); return; }
  if (speechSynthesis.speaking) { speechSynthesis.cancel(); return; }
  const u = new SpeechSynthesisUtterance(text); u.rate = OPT.rate; u.lang = "en-US"; speechSynthesis.speak(u);
}
function toast(msg){ const t=document.createElement("div"); t.className="toast"; t.setAttribute("role","status"); t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2600); }
const stars = n => "★".repeat(n)+"☆".repeat(3-n);

/* ---------- scoring ---------- */
function points(){
  let p=0;
  for (const k in S.res){ const r=S.res[k]; if (r.ok) p += r.tries===1?10:(r.tries===2?5:2); }
  for (const k in S.stamped) if (S.stamped[k]) p += 5;
  return p;
}
let RANKS = [[0,"Stowaway"],[100,"Passenger"],[250,"Navigator"],[380,"Co-Pilot"],[460,"Captain of the Cell Cruiser"]];
function rankOf(p){ let r=RANKS[0][1]; for (const [m,n] of RANKS) if (p>=m) r=n; return r; }
function levelStats(n){
  let tot=0, first=0;
  for (const k in S.res){ if (k.startsWith(n+":")){ tot++; if (S.res[k].ok && S.res[k].tries===1) first++; } }
  return {tot, first};
}
function levelStars(n){
  if (n===1) return 3;
  const {tot, first} = levelStats(n); if (!tot) return 1;
  const r = first/tot; return r>=0.9?3:(r>=0.7?2:1);
}

/* ---------- themed spray on correct answers ---------- */
const SPRAY = {bus:["🚌","⭐","🔬","🧪","✨","🧬"], quest:["⚔️","🛡️","🪙","✨","🐉","👑"]};
function burst(el, n){
  if (!el.animate) return;
  const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  const set = SPRAY[S.theme] || SPRAY.bus;
  requestAnimationFrame(()=>{
    const r = el.getBoundingClientRect(); const cx = r.left + r.width/2, cy = r.top + r.height/2;
    if (reduce){
      // gentle version: icons appear around the answer and fade, with no flying motion
      const k = 8;
      for (let i=0;i<k;i++){
        const s = document.createElement("span"); s.className="spray"; s.setAttribute("aria-hidden","true");
        s.textContent = set[i % set.length]; s.style.fontSize="28px";
        const ang = (i/k)*Math.PI*2;
        s.style.left = (cx + Math.cos(ang)*Math.min(r.width/2.2, 150))+"px"; s.style.top = (cy + Math.sin(ang)*28)+"px";
        s.style.transform="translate(-50%,-50%)"; document.body.appendChild(s);
        const a = s.animate([{opacity:0},{opacity:1,offset:.2},{opacity:1,offset:.7},{opacity:0}],{duration:1400});
        a.onfinish = () => s.remove();
      }
      return;
    }
    for (let i=0;i<n;i++){
      const s = document.createElement("span"); s.className="spray"; s.setAttribute("aria-hidden","true");
      s.textContent = set[i % set.length]; s.style.left = cx+"px"; s.style.top = cy+"px"; s.style.fontSize = (20+Math.random()*16)+"px";
      document.body.appendChild(s);
      const ang = -Math.PI/2 + (Math.random()-.5)*Math.PI*1.15, dist = 90 + Math.random()*170;
      const dx = Math.cos(ang)*dist, dy = Math.sin(ang)*dist, rot = (Math.random()-.5)*360;
      const a = s.animate([
        {transform:"translate(-50%,-50%) scale(.4)", opacity:1},
        {transform:`translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(1.1) rotate(${rot/2}deg)`, opacity:1, offset:.45},
        {transform:`translate(calc(-50% + ${dx*1.2}px), calc(-50% + ${dy+190}px)) scale(.9) rotate(${rot}deg)`, opacity:0}
      ], {duration:1100+Math.random()*600, easing:"cubic-bezier(.2,.7,.4,1)"});
      a.onfinish = () => s.remove();
    }
  });
}

/* ---------- navigation ---------- */
function go(view, level=0, idx=0){
  stopSpeech();
  S.stack.push({view:S.view, level:S.level, idx:S.idx});
  S.view=view; S.level=level; S.idx=idx; render(); window.scrollTo(0,0);
}
function back(){
  stopSpeech();
  const p = S.stack.pop(); if (!p) return;
  S.view=p.view; S.level=p.level; S.idx=p.idx; render(); window.scrollTo(0,0);
}
function nextStep(){
  const L = LEVELS[S.level-1];
  if (S.idx+1 < L.len){ go("step", S.level, S.idx+1); }
  else { S.done[S.level]=true; go("levelDone", S.level, 0); }
}

  </header>
  <main id="main" tabindex="-1">${inner}</main>`;
}
function render(){
  const app = $("#app");
  let html = "";
  if (S.view==="pick") html = vPick();
  else if (S.view==="welcome") html = vWelcome();
  else if (S.view==="map") html = vMap();
  else if (S.view==="step") html = vStep();
  else if (S.view==="levelDone") html = vLevelDone();
  else if (S.view==="summary") html = vSummary();
  app.innerHTML = shell(html);
  const b = $("#back"); if (b) b.onclick = back;

}

      <div class="row" style="margin-top:4px"><button class="btn small" data-listen="${esc(o.name+". "+found+". "+o.explain+" City job. "+o.city)}">Listen</button></div>
      <fieldset class="todo"><legend>On your ${cell} cell sheet, find number ${o.num}</legend>
        <label><input type="checkbox" data-c="0" ${c[0]?"checked":""}><span>Write <b>${esc(o.name)}</b> on the Name line.</span></label>
        <label><input type="checkbox" data-c="1" ${c[1]?"checked":""}><span>Write the job: <b>${esc(o.job)}</b></span></label>
        <label><input type="checkbox" data-c="2" ${c[2]?"checked":""}><span>Color it. Try <b>${esc(o.color)}</b>${swatchHTML(o.color)}. ${key==="ribo"||key==="mito"||key==="chloro"||key==="vacuole"||key==="lyso"?"Color every copy.":"Any color works."}</span></label>
      </fieldset>
      <div class="row"><button class="btn primary" id="stamp" ${c.every(Boolean)||UNLOCK?"":"disabled"}>Stamp it and go on</button></div>
    </div>
  </div>`;
}

function recallStep(key, idx, L, prog){
  const o = ORG[key]; const id = `${S.level}:${idx}`;
  const r = S.res[id] || {tries:0, ok:false, wrong:[]};
  const ord = orderFor(id, ()=>choicesFor(key, ANIMAL_ORDER));
  const c = S.chk[id] || (S.chk[id]=[false,false]);
  const solved = r.ok;
  const ch = ord.map((k,i)=>{
    const st = solved && k===key ? "correct" : (r.wrong.includes(k)?"wrong":"");
    const tag = st==="correct"?`<span class="tag">Correct</span>`:(st==="wrong"?`<span class="tag">Not this one</span>`:"");
    return `<button class="choice ${st}" data-pick="${k}" ${solved||r.wrong.includes(k)?"disabled":""}><span class="letter">${LET[i]}</span><span class="txt">${esc(ORG[k].name)}</span>${tag}</button>`;
  }).join("");
  const hint = !solved && r.wrong.length ? `<div class="fb bad" role="status">Hint: this part ${esc(o.job)}.</div>` : "";
  const done = solved ? `<div class="fb good" role="status"><strong>Yes, it is the ${esc(o.name)}.</strong> It is number ${o.num} on your animal cell sheet.</div>
    <fieldset class="todo"><legend>On your animal cell sheet, find number ${o.num}</legend>
      <label><input type="checkbox" data-c="0" ${c[0]?"checked":""}><span>Write <b>${esc(o.name)}</b> and the job: <b>${esc(o.job)}</b></span></label>
      <label><input type="checkbox" data-c="1" ${c[1]?"checked":""}><span>Color it the <b>same color</b> you used on the plant cell.</span></label>
    </fieldset>
    <div class="row"><button class="btn primary" id="next" ${c.every(Boolean)||UNLOCK?"":"disabled"}>Next part</button></div>` : "";
  return `${prog}<p class="stepno">Quick-find ${idx+1} of ${RECALL.length}, then 2 new parts</p>
  ${idx===0?bubble(INTROS.animal):""}
  <div class="tour" data-focus="${key}" data-cell="animal" data-hide="${solved?"0":"1"}">
    <div>${diagramHTML("animal",key,{cap:"Dog paw cell (an animal cell)"})}</div>
    <div class="card"><h2>Which part is glowing?</h2>
      <p>You met this part in the plant cell. Name it before the number badges show up.</p>
      ${ch}${hint}
      <div class="row"><button class="btn small" data-listen="Which part is glowing? ${esc(ord.map((k,i)=>LET[i]+". "+ORG[k].name).join(". "))}">Listen</button></div>
      ${done}
    </div></div>`;
}

function quizFrame(L, prog, qno, body){
  return `${prog}<p class="stepno">Question ${qno} of ${L.len}</p>${S.idx===0?`<div class="quiz" style="margin-bottom:0">${bubble(INTROS[S.level])}</div>`:""}<div class="quiz card">${body}</div>`;
}
function choiceBlock(id, ord, key, solved, r, extra){
  return ord.map((k,i)=>{
    const st = solved && k===key ? "correct" : (r.wrong.includes(k)?"wrong":"");
    const tag = st==="correct"?`<span class="tag">Correct</span>`:(st==="wrong"?`<span class="tag">Not this one</span>`:"");
    return `<button class="choice ${st}" data-pick="${k}" ${solved||r.wrong.includes(k)?"disabled":""}><span class="letter">${LET[i]}</span><span class="txt">${esc(ORG[k].name)}</span>${tag}</button>`;
  }).join("");
}

function quizStep(L, prog){
  const id=`${S.level}:${S.idx}`; const q=JOBS[S.idx];
  const r=S.res[id]||{tries:0,ok:false,wrong:[]};
  const ord=orderFor(id,()=>shuffle([q.a,...q.d]));
  const listen = `${q.q} ${ord.map((k,i)=>LET[i]+". "+ORG[k].name).join(". ")}`;
  const fb = r.ok ? `<div class="fb good" role="status"><strong>Right.</strong> The ${esc(ORG[q.a].name)} ${esc(ORG[q.a].job)}.</div>` :
    (r.wrong.length?`<div class="fb bad" role="status">Not that one. Read the clue again and try another.</div>`:"");
  return quizFrame(L, prog, S.idx+1, `<p class="qprompt">${esc(q.q)}</p>${choiceBlock(id,ord,q.a,r.ok,r)}${fb}
    <div class="row"><button class="btn small" data-listen="${esc(listen)}">Listen</button><span class="spacer"></span>${r.ok?`<button class="btn primary" id="next">${S.idx+1<L.len?"Next question":"Finish level"}</button>`:""}</div>`);
}

function sortStep(L, prog){
  const id=`${S.level}:${S.idx}`; const q=SORTS[S.idx];
  const r=S.res[id]||{tries:0,ok:false,wrong:[]};
  const opts=[["plant","Plant cell only"],["animal","Animal cell only"],["both","Both cells"]];
  const btns = opts.map(([k,t])=>{
    const st = r.ok && k===q.a ? "correct" : (r.wrong.includes(k)?"wrong":"");
    const tag = st==="correct"?` <span class="tag">Correct</span>`:(st==="wrong"?` <span class="tag">Not this one</span>`:"");
    return `<button class="choice ${st}" data-sort="${k}" ${r.ok||r.wrong.includes(k)?"disabled":""}>${t}${tag}</button>`;
  }).join("");
  const fb = r.ok ? `<div class="fb good" role="status"><strong>Right.</strong> ${esc(q.why)}</div>` : (r.wrong.length?`<div class="fb bad" role="status">Not that one. Think about what each cell has, then try again.</div>`:"");
  return quizFrame(L, prog, S.idx+1, `<p class="qprompt">On our diagrams, which cell has this?</p><div class="bigword">${esc(q.t)}</div><div class="sort3">${btns}</div>${fb}
    <div class="row"><button class="btn small" data-listen="On our diagrams, which cell has this? ${esc(q.t)}. Plant cell only, animal cell only, or both cells.">Listen</button><span class="spacer"></span>${r.ok?`<button class="btn primary" id="next">${S.idx+1<L.len?"Next item":"Finish level"}</button>`:""}</div>`);
}

function caseStep(L, prog){
  const id=`${S.level}:${S.idx}`; const q=CASES[S.idx];
  const r=S.res[id]||{tries:0,ok:false,wrong:[]};
  const ord=orderFor(id,()=>shuffle([q.a,...q.d]));
  const listen = `Case ${S.idx+1}. ${q.t}. ${q.s} Which organelle is the problem? ${ord.map((k,i)=>LET[i]+". "+ORG[k].name).join(". ")}`;
  const fb = r.ok ? `<div class="fb good" role="status"><strong>Problem solved.</strong> The ${esc(ORG[q.a].name)} ${esc(ORG[q.a].job)}. ${esc(ORG[q.a].explain)}</div>` :
    (r.wrong.length?`<div class="fb bad" role="status">Not the culprit. Re-read the clue: what job is missing?</div>`:"");
  const mini = r.ok ? `<div class="mini" data-focus="${q.a}" data-cell="${q.cell}" data-hide="0">${diagramHTML(q.cell,q.a)}</div>` : "";
  return `${prog}<p class="stepno">${TX.caseWord} ${S.idx+1} of ${L.len}</p>${S.idx===0?`<div class="quiz" style="margin-bottom:0">${bubble(INTROS[5])}</div>`:""}<div class="quiz card">
    <h2>${esc(q.t)}</h2><div class="scene">${esc(q.s)}</div>
    <p class="qprompt">Which organelle is the problem?</p>${choiceBlock(id,ord,q.a,r.ok,r)}${fb}${mini}
    <div class="row"><button class="btn small" data-listen="${esc(listen)}">Listen</button><span class="spacer"></span>${r.ok?`<button class="btn primary" id="next">${S.idx+1<L.len?"Next case":"Finish level"}</button>`:""}</div></div>`;
}

function bossStep(L, prog){
  const id=`${S.level}:${S.idx}`; const q=BOSS[S.idx];
  const r=S.res[id]||{tries:0,ok:false,wrong:[]};
  const pool = q.cell==="plant"?PLANT_ORDER:ANIMAL_ORDER;
  const ord=orderFor(id,()=>choicesFor(q.a,pool));
  const fb = r.ok ? `<div class="fb good" role="status"><strong>Yes.</strong> The ${esc(ORG[q.a].name)} ${esc(ORG[q.a].job)}.</div>` :
    (r.wrong.length?`<div class="fb bad" role="status">Not this one. Look at its shape and where it sits in the cell.</div>`:"");
  return `${prog}<p class="stepno">${TX.bossWord} ${S.idx+1} of ${L.len}</p>
  ${S.idx===0?bubble(INTROS[6]):""}
  <div class="tour" data-focus="${q.a}" data-cell="${q.cell}" data-hide="1">
    <div>${diagramHTML(q.cell,q.a)}</div>
    <div class="card"><h2>What is the glowing part?</h2>
      ${choiceBlock(id,ord,q.a,r.ok,r)}${fb}
      <div class="row"><button class="btn small" data-listen="What is the glowing part? ${esc(ord.map((k,i)=>LET[i]+". "+ORG[k].name).join(". "))}">Listen</button><span class="spacer"></span>${r.ok?`<button class="btn primary" id="next">${S.idx+1<L.len?"Next part":"Finish level"}</button>`:""}</div>
    </div></div>`;
}


function vLevelDone(){
  const L = LEVELS[S.level-1]; const st = levelStats(S.level);
  const acc = st.tot ? `<p>First-try answers: <strong>${st.first} of ${st.tot}</strong></p>` : "";
  const last = S.level===LEVELS.length;
  return `<div class="quiz card" style="margin-top:22px"><h2>Level ${L.n} complete: ${esc(L.title)}</h2>
    <p class="stars" style="font-size:1.8rem" aria-label="${levelStars(L.n)} of 3 stars">${stars(levelStars(L.n))}</p>${acc}
    ${bubble(TIPS[L.n])}
    <div class="row"><button class="btn primary" id="cont">${last?"See my results":`Continue to level ${L.n+1}`}</button><button class="btn" id="toMap">Route map</button></div></div>`;
}

function vSummary(){
  const p = points(); const w = S.who;
  const who = (w.name||w.hour) ? `<p>${esc(w.name||"Inspector")}${w.hour?`, hour ${esc(w.hour)}`:""}</p>` : "";
  const rows = LEVELS.map(L=>{ const st=levelStats(L.n); return `<tr><td>${L.n}. ${esc(L.title)}</td><td>${S.done[L.n]?`<span aria-label="${levelStars(L.n)} of 3 stars">${stars(levelStars(L.n))}</span>`:"Not played"}</td><td>${st.tot?`${st.first} of ${st.tot}`:"-"}</td></tr>`; }).join("");
  const stamps = [...PLANT_ORDER.filter((k,i)=>S.stamped["1:"+i]), ...NEWBIES.filter((k,i)=>S.stamped["2:"+(RECALL.length+i)])];
  const passport = stamps.length ? stamps.map(k=>`<span class="found" style="margin:3px 4px 3px 0">${esc(ORG[k].name)}</span>`).join("") : "No stamps yet";
  return `<h2 style="margin-top:22px">${TX.sumH2}</h2>
  ${bubble(TX.sum)}
  <div class="card codecard"><h2>Show your teacher</h2>
    <p class="note" style="margin:0">Your code word:</p><p class="codeword" id="codeword">${esc(CODE)}</p>
    <ol><li>Write the code word in the Code Word box on page 2 of your sheet.</li><li>Show your teacher your finished sheet and this screen.</li></ol></div>
  <div class="sumgrid">
    <div class="card">${who}<p>${TX.rank}</p><p class="rank">${esc(rankOf(p))}</p><p><strong>${p}</strong> points</p>
      <p class="note">Ranks go up at 100, 250, 380, and 460 points.</p></div>
    <div class="card"><h2>Finish your sheet</h2><ul class="checks">
      <li>Every part colored, all copies</li><li>All names and jobs filled in on both pages</li>
      <li>Compare sentences finished on page 2</li><li>Name and hour at the top</li><li>Code word written on page 2</li><li>Shown to your teacher</li></ul>
      <p class="note">Extra time? Try a Going Further choice on page 2.</p></div>
  </div>
  <div class="card" style="margin-top:14px"><h2>${TX.lootTitle}</h2><p class="note">${TX.lootNote}</p><div>${passport}</div></div>
  <div class="card" style="margin-top:14px"><h2>Your levels</h2>
    <table class="stats"><thead><tr><th>Level</th><th>Stars</th><th>First try</th></tr></thead><tbody>${rows}</tbody></table></div>
  <div class="row"><button class="btn" id="toMap">Route map</button><button class="btn" id="again">Start over</button></div>`;
}

/* ---------- interaction wiring ---------- */
function wire(){
  // highlight diagrams
  $$("[data-focus]").forEach(el=>{
    focusDiagram(el, el.dataset.focus, el.dataset.hide==="1", el.dataset.color||"");
  });
  $$("[data-listen]").forEach(b=> b.onclick = ()=>speak(b.dataset.listen));
  const st=$("#start"); if (st) st.onclick=()=>{
    S.who.name=$("#nm").value.trim(); S.who.hour=$("#hr").value.trim();
    const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (reduce || UNLOCK){ go("map"); return; }
    st.disabled=true; const cd=$("#countdown"); const hb=$("#herobus");
    if (S.theme==="quest"){
      cd.textContent="Rolling..."; hb.classList.add("spin");
      setTimeout(()=>{ cd.textContent="Natural 20!"; },1300);
      setTimeout(()=>go("map"),2100);
    } else {
      let n=3; cd.textContent="3...";
      const tick=setInterval(()=>{ n--; if(n>0){ cd.textContent=n+"..."; } else { clearInterval(tick); cd.textContent="ZAP!"; hb.classList.add("shrunk"); setTimeout(()=>go("map"),900); } },700);
    }
  };
  $$("button[data-theme]").forEach(b=> b.onclick=()=>{ setTheme(b.dataset.theme); go("welcome"); });
  $$("[data-lvl]").forEach(b=> b.onclick=()=>{ const n=+b.dataset.lvl; go("step", n, 0); });
  const ts=$("#toSummary"); if (ts) ts.onclick=()=>go("summary");
  const tm=$("#toMap"); if (tm) tm.onclick=()=>go("map");
  const ag=$("#again"); if (ag) ag.onclick=()=>{ if (confirm("Start over? Your points and stars will reset.")) { stopSpeech(); S.res={};S.chk={};S.stamped={};S.ord={};S.done={};S.stack=[];S.view="pick";S.level=0;S.idx=0;setTheme("bus");render(); } };
  const ct=$("#cont"); if (ct) ct.onclick=()=>{ if (S.level===LEVELS.length) go("summary"); else go("step", S.level+1, 0); };

  // tour checkboxes + stamp
  const boxes=$$("input[data-c]");
  if (boxes.length){
    const id=`${S.level}:${S.idx}`;
    boxes.forEach(cb=> cb.onchange=()=>{
      S.chk[id][+cb.dataset.c]=cb.checked;
      const ready = S.chk[id].every(Boolean) || UNLOCK;
      const btn=$("#stamp")||$("#next"); if (btn) btn.disabled=!ready;
    });
  }
  const stamp=$("#stamp"); if (stamp) stamp.onclick=()=>{ S.stamped[`${S.level}:${S.idx}`]=true; nextStep(); };
  const nx=$("#next"); if (nx) nx.onclick=()=>nextStep();

  // quiz picks
  $$("[data-pick]").forEach(b=> b.onclick=()=>answer(b.dataset.pick));
  $$("[data-sort]").forEach(b=> b.onclick=()=>answer(b.dataset.sort));
}

function correctKey(){
  const L=LEVELS[S.level-1];
  if (L.type==="animal") return RECALL[S.idx];
  if (L.type==="quiz") return JOBS[S.idx].a;
  if (L.type==="sort") return SORTS[S.idx].a;
  if (L.type==="case") return CASES[S.idx].a;
  if (L.type==="boss") return BOSS[S.idx].a;
}
function answer(pick){
  const id=`${S.level}:${S.idx}`;
  const r = S.res[id] || (S.res[id]={tries:0, ok:false, wrong:[]});
  if (r.ok) return;
  r.tries++;
  if (pick===correctKey()) r.ok=true; else r.wrong.push(pick);
  const keep = window.scrollY;
  render(); window.scrollTo(0,keep);
  if (r.ok){ const el=$(".choice.correct"); if (el) burst(el, r.tries===1?18:9); }
}

/* ---------- reading options ---------- */
function openOptions(){
  const scrim=document.createElement("div"); scrim.className="scrim";
  const seg=(name,items)=>`<div class="seg" role="group" aria-label="${name}">${items.map(([v,t])=>`<button data-o="${name}" data-v="${v}" aria-pressed="${String(OPT[name]==v)}">${t}</button>`).join("")}</div>`;
  scrim.innerHTML=`<div class="panel" role="dialog" aria-modal="true" aria-labelledby="ot"><h2 id="ot">Reading options</h2>
    <p class="note">Pick what is easiest for your eyes. These stay on this device.</p>
    <div class="opt"><b>Text size</b>${seg("size",[[90,"Smaller"],[100,"Normal"],[120,"Larger"],[140,"Largest"]])}</div>
    <div class="opt"><b>Letters</b>${seg("font",[["standard","Standard"],["easy","Easy read"]])}</div>
    <div class="opt"><b>Line spacing</b>${seg("line",[[1.6,"Normal"],[1.85,"Roomy"],[2.1,"Extra roomy"]])}</div>
    <div class="opt"><b>Background</b>${seg("bg",[["white","White"],["cream","Cream"],["blue","Light blue"],["gray","Light gray"]])}</div>
    <div class="opt"><b>Listen speed</b>${seg("rate",[[0.8,"Slow"],[1,"Normal"],[1.2,"Fast"]])}</div>
    <div class="row"><button class="btn primary" id="oc">Done</button><button class="btn" id="or">Reset</button></div></div>`;
  document.body.appendChild(scrim);
  const close=()=>{ scrim.remove(); $("#opts").focus(); };
  scrim.onclick=e=>{ if (e.target===scrim) close(); };
  scrim.onkeydown=e=>{ if (e.key==="Escape") close(); };
  $("#oc",scrim).onclick=close;
  $("#or",scrim).onclick=()=>{ Object.assign(OPT,{size:100,font:"standard",line:1.6,bg:"white",rate:1}); applyOptions(); $$("[data-o]",scrim).forEach(b=>b.setAttribute("aria-pressed",String(OPT[b.dataset.o]==b.dataset.v))); };
  $$("[data-o]",scrim).forEach(b=> b.onclick=()=>{
    const k=b.dataset.o; const v=(k==="size"||k==="line"||k==="rate")?parseFloat(b.dataset.v):b.dataset.v;
    OPT[k]=v; applyOptions();
    $$(`[data-o="${k}"]`,scrim).forEach(x=>x.setAttribute("aria-pressed",String(x===b)));
  });
  $("#oc",scrim).focus();
}

render();
</script>
</body>
